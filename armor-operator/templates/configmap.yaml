apiVersion: v1
kind: ConfigMap
metadata:
  name: armor-config-{{ .ServiceName }}
  namespace: armor
data:
  config.json: |
    {
      "server": {
        "host": "0.0.0.0",
        "port": 3000
      },
      "waf": {
        "enableCrs": {{ .Waf }},
        "customRulesPath": ""
      },
      "proxy": {
        "targetHost": "{{ .TargetHost }}",
        "targetPort": {{ .TargetPort }}
      },
      "oidc": {
        "enable": {{ .Oidc }}
      }
    }